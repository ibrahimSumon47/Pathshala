packages:
  - apps/*
  - packages/*

# pnpm blocks install scripts by default. These fetch the native binaries the Next.js
# and tsx toolchains use; nothing else is allowed to run arbitrary install code.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  mongodb-memory-server: true
  puppeteer: false
  '@scarf/scarf': false
  vue-demi: false

# The OSV scan found two dev-tooling advisories with no upstream fix: linkinator pins
# glob@^13 and depcheck/@typescript-eslint pin minimatch@^10. Both are dev-only; these
# overrides take the patched releases so the dependency scan stays clean.
overrides:
  glob@^13: ^14.0.6
  minimatch@^10: ^11.0.1
